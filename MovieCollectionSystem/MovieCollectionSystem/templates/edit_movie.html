{% extends "base.html" %}

{% block title %}Edit Movie{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Edit movie</h1>

    <form method="POST" action="{{ url_for('edit_movie', movie_id=movie.movie_id) }}" novalidate>

        <label for="movie_name">Movie name</label>
        <input type="text" id="movie_name" name="movie_name" maxlength="150"
               value="{{ movie.movie_name }}" required>

        <label for="genre">Genre</label>
        <select id="genre" name="genre" required>
            <option value="">Choose a genre</option>
            {% for g in genres %}
                <option value="{{ g }}" {% if movie.genre == g %}selected{% endif %}>{{ g }}</option>
            {% endfor %}
        </select>

        <div class="row">
            <div>
                <label for="release_year">Release year</label>
                <input type="number" id="release_year" name="release_year"
                       value="{{ movie.release_year }}" required>
            </div>
            <div>
                <label for="rating">Rating (0 to 10)</label>
                <input type="number" id="rating" name="rating" step="0.1" min="0" max="10"
                       value="{{ movie.rating }}" required>
            </div>
        </div>

        <label for="language">Language</label>
        <input type="text" id="language" name="language" maxlength="50"
               value="{{ movie.language }}" required>

        <div class="form-buttons">
            <button class="btn" type="submit">Update movie</button>
            <a class="btn btn-light" href="{{ url_for('index') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
