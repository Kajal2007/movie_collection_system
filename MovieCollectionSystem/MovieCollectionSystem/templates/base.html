<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Movie Collection{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Top bar shown on every page -->
    <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}">My Movie Shelf</a>
        <nav>
            <a href="{{ url_for('index') }}">All Movies</a>
            <a class="btn btn-small" href="{{ url_for('add_movie') }}">Add Movie</a>
        </nav>
    </header>

    <main class="container">
        <!-- Flash messages (success / error) sent from app.py -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <!-- Each page puts its own content here -->
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">Movie Collection Management System &middot; Flask + MySQL</footer>

</body>
</html>
